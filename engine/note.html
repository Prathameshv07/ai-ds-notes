<title>Sutra</title>
<script>/* apply reader settings before the page paints (no flash of the wrong theme) */
try{var s=JSON.parse(localStorage.getItem('notes_reader_settings_v1')||'{}'),d=document.documentElement;
if(s.theme&&s.theme!=='auto')d.setAttribute('data-theme',s.theme);if(s.font&&s.font!=='m')d.setAttribute('data-font',s.font);
if(s.width&&s.width!=='normal')d.setAttribute('data-width',s.width);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>

</header>
